name: Theme Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  theme-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      # Uses @shopify/theme-check-node (the same engine as `shopify theme check`).
      - name: Run Theme Check
        run: npm run check
